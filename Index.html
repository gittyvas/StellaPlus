<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Player with Ads</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="ppck-ver" content="3de9cc719516f27d2efc126541356170" />
<meta name="a64ac3ddf2844b9f2eacdc2987c6d8bba1f43998" content="a64ac3ddf2844b9f2eacdc2987c6d8bba1f43998" />

<style>
body {
  margin:0;
  padding:0;
  height:100vh;
  background-image:url("IMG_0884.jpeg");
  background-size:cover;
  background-position:center;
  color:white;
  text-align:center;
  position:relative;
  font-family: Arial, sans-serif;
}

/* Video Player */
.video-wrapper {
  position:absolute;
  top:20px;
  right:20px;
  width:400px;
  max-width:80%;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,0.7);
  background:#000;
  z-index:99997;
}

.video-container {
  position:relative;
}

video {
  width:100%;
  display:block;
  cursor:pointer;
  background:#000;
}

/* Central play button */
.play-overlay {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:50px;
  color:#fff;
  background:rgba(0,0,0,0.4);
  border-radius:50%;
  width:80px;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition: background 0.3s;
  z-index:2;
}

.play-overlay:hover {
  background:rgba(0,0,0,0.6);
}

/* container for JuicyAds */
#juicyads-container {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  opacity:0; /* fade-in */
  transition: opacity 0.8s ease-in-out;
  z-index:99998;
  width:100%;
  max-width:300px;
}

/* A-Ads Sticky Banner */
#aads-container {
  width: 100%;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  text-align: center;
  z-index: 99999;
  padding: 8px 0;
  background: rgba(0,0,0,0); /* transparent, iframe handles content */
}

#aads-frame {
  width: 70%;
  max-width: 600px;
  height: auto;
  margin: auto;
  border: none;
  overflow: hidden;
}
</style>
</head>
<body>

<!-- Video Player -->
<div class="video-wrapper">
  <div class="video-container">
    <video id="video" preload="metadata" poster="poster.jpg">
      <source src="demo-video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="play-overlay" id="playOverlay">▶️</div>
  </div>
</div>

<!-- JuicyAds: FADE-IN AFTER 30s -->
<div id="juicyads-container">
  <script type="text/javascript" data-cfasync="false" async src="https://poweredby.jads.co/js/jads.js"></script>
  <ins id="1112966" data-width="300" data-height="262"></ins>
  <script type="text/javascript" data-cfasync="false" async>
    (adsbyjuicy = window.adsbyjuicy || []).push({'adzone':1112966});
  </script>
</div>

<!-- NEW A-Ads STICKY BOTTOM BANNER -->
<div id="aads-container">
  <iframe id="aads-frame" data-aa="2430846" src="//acceptable.a-ads.com/2430846/?size=Adaptive"></iframe>
</div>

<script>
const video = document.getElementById('video');
const playOverlay = document.getElementById('playOverlay');
const juicyAds = document.getElementById('juicyads-container');
let clickCount = 0;

// Pre-roll ad URL
const adVideo = "https://fullchemistry.com/dSm.FYz/dOGLNUvrZuG/UM/iekmN9ouUZdU/lIkKPjT_Yg4nNLzRcQxLM-jbE/tFN/jVgv3/NHzDEPyiNOQq";
const mainVideo = "demo-video.mp4";

// Handle clicks on the video overlay
playOverlay.addEventListener('click', () => {
  clickCount++;

  if (clickCount === 1) {
    // First click → play pre-roll ad
    video.src = adVideo;
    video.load();
    video.play();
    playOverlay.style.display = 'none';
  } else if (clickCount === 2) {
    // Second click → show JuicyAds / A-Ads
    juicyAds.style.opacity = "1";
    alert("Ads opened!"); // optional feedback
  }
});

// After ad ends, load main video automatically
video.addEventListener('ended', () => {
  if (video.src === adVideo) {
    video.src = mainVideo;
    video.load();
    video.play();
  }
});

// Fade in JuicyAds after 30 seconds
window.addEventListener("load", function(){
  setTimeout(function(){
    if(clickCount < 2) { // only fade in if not already opened manually
      juicyAds.style.opacity = "1";
    }
  }, 30000);
});
</script>

</body>
</html>
