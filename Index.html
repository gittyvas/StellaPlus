<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JuicyAds Fade-in Center Ad</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="juicyads-site-verification" content="1c37209260191375b69363a2bbc97c44">

<style>
body{
  margin:0;
  padding:0;
  height:100vh;
  background-image:url("IMG_0884.jpeg");
  background-size:cover;
  background-position:center;
  color:white;
  text-align:center;
  position:relative;
}

/* container for the ad */
#ad-container{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  opacity:0;              /* initially invisible */
  cursor:pointer;         /* shows it’s clickable */
  transition: opacity 0.8s ease-in-out; /* fade-in effect */
}
</style>

</head>
<body>

<h2>Main Site Content</h2>
<p>Click the middle area — the ad is already active but will fade in visually after 30 seconds.</p>

<!-- Ad container (clickable immediately) -->
<div id="ad-container">

<!-- JuicyAds v3.0 -->
<script type="text/javascript" data-cfasync="false" async src="https://poweredby.jads.co/js/jads.js"></script>

<ins id="1112981" data-width="300" data-height="100"></ins>

<script type="text/javascript" data-cfasync="false">
  (adsbyjuicy = window.adsbyjuicy || []).push({'adzone':1112981});
</script>
<!--JuicyAds END-->

</div>

<script>
// Fade in the ad after 30 seconds (30000 milliseconds)
window.addEventListener("load", function(){
  setTimeout(function(){
    document.getElementById("ad-container").style.opacity = "1";
  }, 30000);
});
</script>

</body>
</html>
