<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fade-in Center Ad + Social Banner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  padding:0;
  height:100vh;
  background-image:url("IMG_0884.jpeg");
  background-size:cover;
  background-position:center;
  color:white;
  text-align:center;
  position:relative;
}

/* container for the existing ad (with fade-in) */
#ad-container{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  opacity:0;              /* initially invisible */
  cursor:pointer;
  transition: opacity 0.8s ease-in-out; /* fade-in effect */
}

/* container for the new social banner (no fade-in) */
#social-banner-container{
  position:absolute;
  top:70%;
  left:50%;
  transform:translate(-50%, -50%);
  cursor:pointer;
}
</style>

</head>
<body>

<!-- Existing Ad container (with fade-in) -->
<div id="ad-container">
<script>
(function(kitnk){
    var d = document,
        s = d.createElement('script'),
        l = d.scripts[d.scripts.length - 1];
    s.settings = kitnk || {};
    s.src = "//selfassured-celebration.com/b.X/V/sSdBGVlW0EY-WTcg/kecmQ9CupZoUNlTkrPSTZYe4VOJDoEJy/OBDjEWtlN/jog/4ZM/THIb4rNUQj";
    s.async = true;
    s.referrerPolicy = 'no-referrer-when-downgrade';
    l.parentNode.insertBefore(s, l);
})({})
</script>
</div>

<!-- New Social Banner container (appears immediately) -->
<div id="social-banner-container">
<script src="https://consumptionbackwardsentiments.com/d1/f9/d0/d1f9d0c9048ad08b5275b7e17e9c68a5.js"></script>
</div>

<script>
// Fade in only the existing ad after 30 seconds
window.addEventListener("load", function(){
  setTimeout(function(){
    document.getElementById("ad-container").style.opacity = "1";
  }, 30000);
});
</script>

</body>
</html>
