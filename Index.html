<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fade-in Center Ad + Social Banner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  padding:0;
  height:100vh;
  background-image:url("IMG_0884.jpeg");
  background-size:cover;
  background-position:center;
  color:white;
  text-align:center;
  position:relative;
}

/* Existing ad container (fade-in after 30s) */
#ad-container{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%) translateY(-100px); /* start off-screen */
  opacity:0;               /* initially invisible */
  cursor:pointer;
  pointer-events:auto;     /* clickable even when invisible */
  transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
}

/* Social banner container (appears immediately) */
#social-banner-container{
  position:absolute;
  top:70%;
  left:50%;
  transform:translate(-50%, -50%);
  cursor:pointer;
}
</style>
</head>
<body>

<!-- Existing Ad (with fade-in) -->
<div id="ad-container">
<script>
  atOptions = {
    'key' : '1101e113121749e5852f56c3e2b573ea',
    'format' : 'iframe',
    'height' : 250,
    'width' : 300,
    'params' : {}
  };
</script>
<script src="https://consumptionbackwardsentiments.com/1101e113121749e5852f56c3e2b573ea/invoke.js"></script>
</div>

<!-- Social Banner (appears immediately) -->
<div id="social-banner-container">
<script src="https://consumptionbackwardsentiments.com/d1/f9/d0/d1f9d0c9048ad08b5275b7e17e9c68a5.js"></script>
</div>

<script>
// Fade-in the existing ad after 30 seconds
window.addEventListener("load", function(){
  setTimeout(function(){
    var ad = document.getElementById("ad-container");
    ad.style.opacity = "1";
    ad.style.transform = "translate(-50%, -50%) translateY(0)"; // slide into view
  }, 30000);
});
</script>

</body>
</html>
