<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JuicyAds Fade-in Center Ad + Multi Video Ads</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  padding:0;
  height:100vh;
  background-image:url("IMG_0884.jpeg");
  background-size:cover;
  background-position:center;
  color:white;
  text-align:center;
  position:relative;
}

/* container for the JuicyAds ad */
#ad-container{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  opacity:0;              /* initially invisible */
  cursor:pointer;         
  transition: opacity 0.8s ease-in-out; 
}
</style>
</head>
<body>

<!-- JuicyAds fade-in center ad -->
<div id="ad-container">
  <script type="text/javascript" data-cfasync="false" async src="https://poweredby.jads.co/js/jads.js"></script>
  <ins id="1112966" data-width="300" data-height="262"></ins>
  <script type="text/javascript" data-cfasync="false" async>
    (adsbyjuicy = window.adsbyjuicy || []).push({'adzone':1112966});
  </script>
</div>

<script>
// Fade in the JuicyAds ad after 30 seconds
window.addEventListener("load", function(){
  setTimeout(function(){
    document.getElementById("ad-container").style.opacity = "1";
  }, 30000);
});
</script>
