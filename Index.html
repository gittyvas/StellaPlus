<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JuicyAds & A-Ads Fade-in</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="ppck-ver" content="3de9cc719516f27d2efc126541356170" />
<meta name="a64ac3ddf2844b9f2eacdc2987c6d8bba1f43998" content="a64ac3ddf2844b9f2eacdc2987c6d8bba1f43998" />

<style>
body {
  margin:0;
  padding:0;
  height:100vh;
  background-image:url("IMG_0884.jpeg");
  background-size:cover;
  background-position:center;
  color:white;
  text-align:center;
  position:relative;
}

/* container for JuicyAds */
#juicyads-container {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  opacity:0; /* fade-in */
  transition: opacity 0.8s ease-in-out;
  z-index:99998;
  width:100%;
  max-width:300px;
}

/* A-Ads Sticky Banner */
#aads-container {
  width: 100%;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  text-align: center;
  z-index: 99999;
  padding: 8px 0;
  background: rgba(0,0,0,0); /* transparent, iframe handles content */
}

#aads-frame {
  width: 70%;
  max-width: 600px;
  height: auto;
  margin: auto;
  border: none;
  overflow: hidden;
}
</style>
</head>
<body>

<!-- JuicyAds: FADE-IN AFTER 30s -->
<div id="juicyads-container">
  <script type="text/javascript" data-cfasync="false" async src="https://poweredby.jads.co/js/jads.js"></script>
  <ins id="1112966" data-width="300" data-height="262"></ins>
  <script type="text/javascript" data-cfasync="false" async>
    (adsbyjuicy = window.adsbyjuicy || []).push({'adzone':1112966});
  </script>
</div>

<!-- NEW A-Ads STICKY BOTTOM BANNER (No Close Button) -->
<!-- BEGIN AADS AD UNIT 2430846 -->
<div id="aads-container">
  <iframe id="aads-frame" data-aa="2430846" src="//acceptable.a-ads.com/2430846/?size=Adaptive"></iframe>
</div>
<!-- END AADS AD UNIT 2430846 -->

<script>
// Fade in JuicyAds after 30 seconds
window.addEventListener("load", function(){
  setTimeout(function(){
    document.getElementById("juicyads-container").style.opacity = "1";
  }, 30000);
});
</script>

</body>
</html>
