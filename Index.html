<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JuicyAds & A-Ads Fade-in</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="ppck-ver" content="3de9cc719516f27d2efc126541356170" />
<meta name="a64ac3ddf2844b9f2eacdc2987c6d8bba1f43998" content="a64ac3ddf2844b9f2eacdc2987c6d8bba1f43998" />

<style>
body {
  margin:0;
  padding:0;
  height:100vh;
  background-image:url("IMG_0884.jpeg");
  background-size:cover;
  background-position:center;
  color:white;
  text-align:center;
  position:relative;
}

/* container for all ads */
#ad-container {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px; /* spacing between ads */
}
</style>
</head>
<body>

<!-- Ad container -->
<div id="ad-container">

  <!-- A-Ads: VISIBLE IMMEDIATELY -->
  <div id="aads-container" style="width:100%; max-width:300px; z-index:99999;">
    <iframe data-aa="2430845"
      src="//acceptable.a-ads.com/2430845/?size=Adaptive"
      style="border:0; width:100%; height:250px; overflow:hidden; display:block; margin:auto;">
    </iframe>
  </div>

  <!-- JuicyAds: FADE-IN AFTER 30s -->
  <div id="juicyads-container" style="opacity:0; transition: opacity 0.8s ease-in-out; z-index:99998; width:100%; max-width:300px;">
    <script type="text/javascript" data-cfasync="false" async src="https://poweredby.jads.co/js/jads.js"></script>
    <ins id="1112966" data-width="300" data-height="262"></ins>
    <script type="text/javascript" data-cfasync="false" async>
      (adsbyjuicy = window.adsbyjuicy || []).push({'adzone':1112966});
    </script>
  </div>

</div>

<script>
// Fade in JuicyAds after 30 seconds
window.addEventListener("load", function(){
  setTimeout(function(){
    document.getElementById("juicyads-container").style.opacity = "1";
  }, 30000);
});
</script>

</body>
</html>
