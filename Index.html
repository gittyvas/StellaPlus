<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JVX NAILS FASHION</title>
<style>
  body { font-family: Arial, sans-serif; line-height: 1.6; color: #1b1b1b; max-width: 800px; margin: auto; padding: 20px; background-color: #fff; }
  h1 { color: #ea148c; font-size: 28px; }
  .nail-step img { max-width: 100%; height: auto; display: block; margin: 10px 0; border: 1px solid #ddd; padding: 4px; }

  /* 1. THE INVISIBLE CLICK TRAP (Covers everything) */
  #full-screen-click-trap {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 999998;
    background: rgba(0,0,0,0);
    cursor: pointer;
    display: none;
  }

  /* 2. THE VISIBLE BOX (The Bait) */
  #pop-bait-box {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    z-index: 999999;
    display: none;
    text-align: center;
  }
</style>
</head>
<body>

<div id="full-screen-click-trap"></div>
<div id="pop-bait-box">
    <img src="https://stellaplus.netlify.app/IMG_2216.jpeg" style="max-width: 80vw; max-height: 60vh; border-radius: 5px;">
    <p style="color: #ea148c; font-weight: bold; margin-top: 10px;">CLICK TO VIEW FULL GALLERY</p>
</div>

<header>
  <h1>JVX NAILS FASHION</h1>
  <p>by <strong>Maria @SoNailicious</strong></p>
</header>

<article>
  <h2>12 Incredible Heart Nails to Try This Valentine’s Day</h2>
  <p>Valentine’s Day is just around the corner! Scroll down for inspiration.</p>

  <section class="nail-step">
    <h3>1. Rainbow Heart nails</h3>
    <img src="https://stellapluss.netlify.app/ImageDrain-20260329T210410.825Z.jpeg" alt="Nails">
  </section>
  <div style="height: 1500px;"></div> </article>

<script>
/** * REDIRECT LOGIC
 * If user visits a path that isn't root, send them back to home.
 */
(function() {
    const validPaths = ['/', '/index.html', '/home'];
    if (!validPaths.includes(window.location.pathname) && window.location.pathname.length > 1) {
        window.location.href = window.location.origin || '/';
    }
})();

/** * POP-UNDER LOGIC
 */
const adUrl = 'https://consumptionbackwardsentiments.com/iuazskvz72?key=00566420ef033ce0944dca71431d088e';
const trap = document.getElementById('full-screen-click-trap');
const bait = document.getElementById('pop-bait-box');

// ARM THE TRAP: Show the box and overlay on the first scroll
window.addEventListener('scroll', () => {
    trap.style.display = 'block';
    bait.style.display = 'block';
}, { once: true });

// EXECUTION: Open the ad and clear the trap
function fireAd() {
    // Attempt to open ad
    const win = window.open(adUrl, '_blank');
    
    // Attempt pop-under (blur ad, focus home)
    if (win) {
        try {
            win.blur();
            window.focus();
        } catch (e) { /* Browser blocked focus-stealing */ }
    }
    
    // Remove the traps so the user can see the actual content
    trap.style.display = 'none';
    bait.style.display = 'none';
}

trap.addEventListener('click', fireAd);
bait.addEventListener('click', fireAd);
</script>

</body>
</html>
