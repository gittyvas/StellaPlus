<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video.js Player with HilltopAds Pre-roll</title>

  <!-- Video.js CSS from CDN -->
  <link href="https://vjs.zencdn.net/7.22.0/video-js.css" rel="stylesheet" />

  <!-- Video.js contrib-ads CSS -->
  <link href="https://cdn.jsdelivr.net/npm/videojs-contrib-ads@6.9.0/dist/videojs.ads.css" rel="stylesheet"/>

  <!-- Video.js IMA plugin CSS -->
  <link href="https://cdn.jsdelivr.net/npm/videojs-ima@1.8.0/dist/videojs.ima.css" rel="stylesheet"/>

  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    video {
      width: 80%;
      max-width: 800px;
    }
  </style>
</head>

<body>

  <!-- Video Player -->
  <video id="content_video" class="video-js vjs-default-skin" controls preload="auto" poster="poster.jpg" width="640" height="360">
    <source src="demo-video.mp4" type="video/mp4">
  </video>

  <!-- Google IMA SDK -->
  <script src="//imasdk.googleapis.com/js/sdkloader/ima3.js"></script>

  <!-- Video.js and plugins from CDN -->
  <script src="https://vjs.zencdn.net/7.22.0/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-ads@6.9.0/dist/videojs.ads.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/videojs-ima@1.8.0/dist/videojs.ima.min.js"></script>

  <!-- Inline JS for HilltopAds pre-roll -->
  <script>
    // Initialize Video.js player
    var player = videojs('content_video');

    // IMA plugin options with your HilltopAds VAST tag
    var options = {
      id: 'content_video',
      adTagUrl: 'https://fullchemistry.com/d.m/FKz/dqG/NZvfZIG-UF/UeSm/9UuyZPUIlpkxP/T/Y/4/N/zscXxTM/j/ExtxNEjtg/3IN/zkEByWNKQF'
    };

    // Initialize IMA plugin
    player.ima(options);

    // Fallback: play main video if ad fails
    player.on('aderror', function() {
      console.log('Ad failed or error occurred, playing main video.');
      player.play();
    });

    // Remove native controls on iPad/Android to avoid conflicts
    var contentPlayer = document.getElementById('content_video_html5_api');
    if ((navigator.userAgent.match(/iPad/i) || navigator.userAgent.match(/Android/i)) &&
        contentPlayer.hasAttribute('controls')) {
      contentPlayer.removeAttribute('controls');
    }

    // Mobile-safe: initialize ad container on first click/tap
    var startEvent = 'click';
    if (navigator.userAgent.match(/iPhone/i) ||
        navigator.userAgent.match(/iPad/i) ||
        navigator.userAgent.match(/Android/i)) {
      startEvent = 'touchend';
    }

    var wrapperDiv = document.getElementById('content_video');
    var initAdDisplayContainer = function() {
      player.ima.initializeAdDisplayContainer();
      wrapperDiv.removeEventListener(startEvent, initAdDisplayContainer);
    }
    wrapperDiv.addEventListener(startEvent, initAdDisplayContainer, { once: true });
  </script>

</body>
</html>
