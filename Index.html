<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video with Pre-roll Ad</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Video.js styles -->
<link href="https://vjs.zencdn.net/8.0.4/video-js.css" rel="stylesheet">

<style>
body{
  margin:0;
  padding:0;
  background:#000;
  color:white;
  text-align:center;
}

/* Center container for your video */
#video-container {
  max-width: 720px;
  margin: 50px auto;
}
</style>
</head>
<body>

<div id="video-container">
  <video
    id="main-video"
    class="video-js vjs-default-skin"
    controls
    width="720"
    height="405"
    poster="IMG_0884.jpeg"
    playsinline
  >
    <source src="YOUR_VIDEO.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>
</div>

<!-- Video.js scripts -->
<script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-vast-vpaid@2.0.2/dist/videojs_5.vast.vpaid.min.js"></script>

<script>
// Initialize the main video player
var player = videojs('main-video');

player.ready(function(){
  // Hook to trigger pre-roll when user clicks play
  player.on('play', function(){
    
    // Prevent multiple triggers
    if(player.hasPlayedAd) return;
    player.hasPlayedAd = true;

    // Pause main video
    player.pause();

    // Play VAST pre-roll
    player.vastClient({
      adTagUrl: "https://fullchemistry.com/ddmSF/zOd.GXNHv-Z/GWUl/zebmO9ruXZkUVlUkhP/TdYj4ONYz/cUx/M/jGEXtJNfjLgg3wNyz_EzyENsQX",
      playAdAlways: true,
      timeout: 5000,
      adCancelTimeout: 5000,
      onAdEnd: function(){
        // Resume main video after ad finishes
        player.play();
      },
      onAdError: function(){
        // Resume main video if ad fails
        player.play();
      }
    });
  });
});
</script>

</body>
</html>
