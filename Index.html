<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Regina Daniels Video with Pre-roll Ads</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Video.js CSS -->
<link href="https://vjs.zencdn.net/7.22.0/video-js.css" rel="stylesheet" />

<style>
body {
  margin:0;
  padding:0;
  height:100vh;
  background-image:url("IMG_0884.jpeg");
  background-size:cover;
  background-position:center;
  color:white;
  text-align:center;
  position:relative;
  font-family: Arial, sans-serif;
}

/* Video player container top-right */
.video-wrapper {
  position:absolute;
  top:20px;
  right:20px;
  width:400px;
  max-width:80%;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,0.7);
  background:#000;
  z-index:99997;
}

/* JuicyAds container */
#juicyads-container {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  opacity:0;
  transition: opacity 0.8s ease-in-out;
  z-index:99998;
  width:100%;
  max-width:300px;
}

/* A-Ads Sticky Banner */
#aads-container {
  width: 100%;
  position: fixed;
  bottom: 0;
  left: 0;
  text-align: center;
  z-index: 99999;
  padding: 8px 0;
  background: rgba(0,0,0,0);
}

#aads-frame {
  width: 70%;
  max-width: 600px;
  height: auto;
  margin: auto;
  border: none;
  overflow: hidden;
}
</style>

</head>
<body>

<!-- Video Player -->
<div class="video-wrapper">
  <video
    id="my-video"
    class="video-js vjs-big-play-centered"
    controls
    preload="auto"
    width="400"
    height="225"
    poster="poster.jpg"
    data-setup='{}'>
    <source src="demo-video.mp4" type="video/mp4" />
  </video>
</div>

<!-- JuicyAds: FADE-IN AFTER 30s -->
<div id="juicyads-container">
  <script type="text/javascript" data-cfasync="false" async src="https://poweredby.jads.co/js/jads.js"></script>
  <ins id="1112966" data-width="300" data-height="262"></ins>
  <script type="text/javascript" data-cfasync="false" async>
    (adsbyjuicy = window.adsbyjuicy || []).push({'adzone':1112966});
  </script>
</div>

<!-- A-Ads Sticky Banner -->
<div id="aads-container">
  <iframe id="aads-frame" data-aa="2430846" src="//acceptable.a-ads.com/2430846/?size=Adaptive"></iframe>
</div>

<!-- Video.js + IMA (VAST) scripts -->
<script src="https://vjs.zencdn.net/7.22.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-contrib-ads@6.9.0/dist/videojs-contrib-ads.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-ima@1.8.0/dist/videojs.ima.min.js"></script>

<script>
  const player = videojs('my-video');

  // HilltopAds VAST tag (replace with your real VAST URL)
  const vastUrl = "https://YOUR_HILLTOPADS_VAST_URL_HERE";

  let preRollPlayed = false;

  // Initialize IMA plugin
  player.ima({
    adTagUrl: vastUrl,
    debug: true
  });

  // First click on player overlay triggers VAST ad
  player.one('play', function() {
    if (!preRollPlayed) {
      preRollPlayed = true;
      player.ima.initializeAdDisplayContainer();
      player.ima.requestAds();
    }
  });

  // Optional: Fade in JuicyAds after 30s
  window.addEventListener("load", function(){
    setTimeout(function(){
      document.getElementById("juicyads-container").style.opacity = "1";
    }, 30000);
  });
</script>

</body>
</html>
