<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fade-in Ad + Social Banner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  padding:0;
  height:100vh;
  background-image:url("IMG_0884.jpeg");
  background-size:cover;
  background-position:center;
  color:white;
  text-align:center;
  position:relative;
}

/* Existing ad container (fade-in after 30s) */
#ad-container{
  position:absolute;
  top:60vh;  /* 60% down the screen, 40% above */
  left:50%;
  transform:translate(-50%, -50%) translateY(-100px); /* start slightly above for fade-in */
  opacity:0;               /* initially invisible */
  cursor:pointer;
  pointer-events:auto;     /* clickable while hidden */
  transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
}

/* Social banner container (appears immediately at the top) */
#social-banner-container{
  position:absolute;
  top:0;      /* top of the screen */
  left:50%;
  transform:translateX(-50%);
  cursor:pointer;
  z-index:9999; /* make sure it stays above other elements */
}
</style>

</head>
<body>

<!-- Social Banner (appears immediately at top) -->
<div id="social-banner-container">
<script src="https://consumptionbackwardsentiments.com/d1/f9/d0/d1f9d0c9048ad08b5275b7e17e9c68a5.js"></script>
</div>

<!-- Existing Ad (with fade-in) -->
<div id="ad-container">
<script>
  atOptions = {
    'key' : '1101e113121749e5852f56c3e2b573ea',
    'format' : 'iframe',
    'height' : 250,
    'width' : 300,
    'params' : {}
  };
<!-- Social Banner (appears immediately at top) -->
<div id="social-banner-container" style="background:red; width:300px; height:250px; position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:9999;">
  SOCIAL BANNER TEST
</div>

<script>
  // Optional: your social banner script (if it works)
  /*
  <script src="https://consumptionbackwardsentiments.com/d1/f9/d0/d1f9d0c9048ad08b5275b7e17e9c68a5.js"></script>
  */
</script>

<script>
// Fade-in the existing ad after 30 seconds
window.addEventListener("load", function(){
  setTimeout(function(){
    var ad = document.getElementById("ad-container");
    ad.style.opacity = "1";
    ad.style.transform = "translate(-50%, -50%) translateY(0)"; // slide to final position
  }, 30000);
});
</script>

</body>
</html>
